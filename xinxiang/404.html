  <!-- 404 頁可能出現在任何路徑下，這段程式自動判斷網站根目錄，讓圖片與連結正常運作 -->
  <script>
    (function () {
      // 若網站放在「帳號.github.io」根目錄或自訂網域，可把 "auto" 改成 "/"
      var SITE_BASE = "auto";
      if (SITE_BASE !== "auto") { document.write('<base href="' + SITE_BASE + '">'); return; }
      var seg = location.pathname.split("/")[1];
      var base = /\.github\.io$/.test(location.hostname) && seg && seg.indexOf(".") < 0 ? "/" + seg + "/" : "/";
      document.write('<base href="' + base + '">');
    })();
  </script>
